# Lint and every test suite, on every push and pull request. The release workflow
# runs this workflow first and releases only when all of its jobs pass.
#
# Actions are pinned to full commit SHAs (the comment names the release); bump them
# together, after reading their release notes.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    # The oldest and the newest Node.js that npm test promises to run on.
    name: Unit tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  notary:
    # Node.js 22 is the notary's minimum; 24 is what its Docker image runs.
    name: Notary tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: notary/package-lock.json
      - run: npm ci --prefix notary
      - run: npm run test:notary

  e2e:
    name: End-to-end tests (${{ matrix.lang }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            notary/package-lock.json
      - run: npm ci
      - run: npm ci --prefix notary
      # Playwright's Chromium and the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_LANG: ${{ matrix.lang }}
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.lang }}
          path: tests/e2e/output/
          retention-days: 7
