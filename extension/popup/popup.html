<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extName">SSL Checker</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="topbar">
      <img class="topbar-logo" src="../icons/ssl32.png" width="22" height="22" alt="" />
      <div class="site">
        <h1 id="host" class="host"></h1>
        <p id="scheme" class="scheme"></p>
      </div>
      <button id="recheck" class="icon-button" type="button" data-i18n-attr="title:actionRecheck,aria-label:actionRecheck"></button>
      <button id="settings" class="icon-button" type="button" data-i18n-attr="title:actionSettings,aria-label:actionSettings"></button>
    </header>
    <main id="content" aria-live="polite"></main>
    <footer id="footer" class="footer" hidden></footer>
  </body>
</html>
